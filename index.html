<!DOCTYPE html>
<html>
<head>
    <title>Secure Login - IT Dashboard</title>
    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        position: relative;
    }
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: url('bg.jpg') no-repeat center center/cover;
        opacity: 0.7;
        z-index: -1;
    }
    .login-box {
        background: rgba(0,0,0,0.8);
        padding: 40px 35px;
        border-radius: 15px;
        width: 360px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        z-index: 1;
    }
    h2 { margin-bottom: 20px; color: #00e5ff; }
    input {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        font-size: 16px;
    }
    button {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }
    .login-btn { background: #00bcd4; color: white; }
    .change-btn { background: #ff9800; color: white; }
    #msg { color: #ff6666; margin-top: 10px; font-weight: bold; min-height: 20px; }

    /* CAPTCHA Style */
    .captcha-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 15px 0;
    }
    #captchaText {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 4px;
        background: #fff;
        color: #333;
        padding: 8px 15px;
        border-radius: 6px;
        user-select: none;
    }
    #captchaInput {
        width: 140px;
    }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🔐 Secure Login</h2>
    <p>IT Work Management System</p>

    <input type="text" id="username" placeholder="Username" value="admin"><br>
    <input type="password" id="password" placeholder="Password"><br>

    <!-- CAPTCHA -->
    <div class="captcha-container">
        <span id="captchaText"></span>
        <button onclick="generateCaptcha()" style="padding:8px 12px; width:auto; background:#666;">↻</button>
    </div>
    <input type="text" id="captchaInput" placeholder="Enter CAPTCHA" maxlength="6">

    <button class="login-btn" onclick="login()">Login</button><br>
    <button class="change-btn" onclick="changePassword()">Change Password</button>

    <p id="msg"></p>
</div>

<script>
// Default Login Setup
async function hashPassword(password) {
    const msgBuffer = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function initializeDefault() {
    if (!localStorage.getItem("username")) {
        localStorage.setItem("username", "admin");
        const hashed = await hashPassword("admin123");
        localStorage.setItem("password", hashed);
    }
}
initializeDefault();

let currentCaptcha = "";

// Generate Random CAPTCHA
function generateCaptcha() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    currentCaptcha = "";
    for (let i = 0; i < 6; i++) {
        currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById("captchaText").innerText = currentCaptcha;
}

// Login with CAPTCHA
async function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const captchaInput = document.getElementById("captchaInput").value.trim().toUpperCase();
    const msg = document.getElementById("msg");

    if (!user || !pass) {
        msg.innerHTML = "⚠️ Username & Password required!";
        return;
    }
    if (captchaInput !== currentCaptcha) {
        msg.innerHTML = "❌ Invalid CAPTCHA!";
        generateCaptcha();
        document.getElementById("captchaInput").value = "";
        return;
    }

    const savedUser = localStorage.getItem("username");
    const savedHash = localStorage.getItem("password");
    const inputHash = await hashPassword(pass);

    if (user === savedUser && inputHash === savedHash) {
        localStorage.setItem("loggedIn", "true");
        msg.style.color = "#4CAF50";
        msg.innerHTML = "✅ Login Successful! Redirecting...";
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 800);
    } else {
        msg.style.color = "#ff6666";
        msg.innerHTML = "❌ Invalid Username or Password!";
        generateCaptcha();
        document.getElementById("captchaInput").value = "";
    }
}

// Change Password
async function changePassword() {
    const oldPass = prompt("Enter Current Password:");
    if (!oldPass) return;

    const savedHash = localStorage.getItem("password");
    const oldHash = await hashPassword(oldPass);

    if (oldHash === savedHash) {
        const newPass = prompt("Enter New Password (min 6 characters):");
        if (newPass && newPass.length >= 6) {
            const newHash = await hashPassword(newPass);
            localStorage.setItem("password", newHash);
            alert("✅ Password Changed Successfully!");
        } else {
            alert("❌ Password must be at least 6 characters!");
        }
    } else {
        alert("❌ Wrong Current Password!");
    }
}

// Initialize
window.onload = () => {
    initializeDefault();
    generateCaptcha();
};

// Enter Key Support
document.getElementById("captchaInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") login();
});
</script>

</body>
</html>
