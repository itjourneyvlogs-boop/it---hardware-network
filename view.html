<!DOCTYPE html>
<html>
<head>
    <title>పెండింగ్ వర్క్స్ - Raised & Completed Date</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
    body {
        font-family: Arial;
        background: #f4f6f9;
        padding: 20px;
        margin: 0;
    }
    .top {
        margin-bottom: 15px;
        text-align: center;
    }
    button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        color: white;
        font-weight: bold;
    }
    .back { background: #333; }
    .excel { background: green; }
    .print { background: blue; }
    .delete { background: red; }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 10px;
    }
    th, td {
        border: 1px solid #666;
        padding: 10px;
        text-align: center;
        vertical-align: middle;
    }
    th {
        background: #00bcd4;
        color: white;
    }
    .action-btn {
        padding: 6px 12px;
        margin: 3px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
    }
    .completed { color: #4CAF50; font-weight: bold; }
    </style>
</head>

<body>

<div class="top">
    <button class="back" onclick="goBack()">⬅ డాష్‌బోర్డ్‌కి వెళ్లు</button>
    <button class="excel" onclick="exportExcel()">📄 Excel డౌన్‌లోడ్</button>
    <button class="print" onclick="printPage()">🖨 ప్రింట్</button>
    <button class="delete" onclick="deleteAllPending()">🗑 అన్ని పెండింగ్ తీసేయి</button>
</div>

<h2>⏳ Pending Works - Raised Date & Completed Date</h2>

<table id="dataTable">
<thead>
<tr>
    <th>టైపు</th>
    <th>బ్లాక్</th>
    <th>Raised Date</th>
    <th>Completed Date</th>
    <th>సమస్య / మెటీరియల్</th>
    <th>వ్యక్తి / డిపార్ట్‌మెంట్</th>
    <th>స్టేటస్</th>
    <th>యాక్షన్</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let allPending = [];

function loadAllPending() {
    allPending = [];
    const blocks = ["NGH","NSSH","NNC","OPD BLOCK","NMC","NDC","NPC","CAMP OFFICE","SITE OFFICE","BOYS HOSTEL","GIRLS HOSTEL","OTHER"];

    // General Works
    let general = JSON.parse(localStorage.getItem("works")) || [];
    general.forEach((item, idx) => {
        if (item.status === "Pending") {
            allPending.push({
                type: "Work",
                block: item.block || "-",
                raisedDate: item.date || "-",
                completedDate: item.completedDate || "-",
                item: item.problem || "-",
                person: item.dept || "-",
                status: item.status,
                source: "works",
                index: idx,
                isDateTime: false
            });
        }
    });

    blocks.forEach(block => {
        const clean = block.replace(/\s+/g, "_");

        // Block Works
        let bworks = JSON.parse(localStorage.getItem("works_" + clean)) || [];
        bworks.forEach((item, idx) => {
            if (item.status === "Pending") {
                allPending.push({
                    type: "Block Work",
                    block: block,
                    raisedDate: item.date || "-",
                    completedDate: item.completedDate || "-",
                    item: item.problem || "-",
                    person: item.dept || "-",
                    status: item.status,
                    source: "works_" + clean,
                    index: idx,
                    isDateTime: false
                });
            }
        });

        // Indents
        let indents = JSON.parse(localStorage.getItem("indents_" + clean)) || [];
        indents.forEach((item, idx) => {
            if (item.status === "Pending") {
                allPending.push({
                    type: "Indent",
                    block: block,
                    raisedDate: item.date || "-",
                    completedDate: item.completedDate || "-",
                    item: item.material || "-",
                    person: item.personName || "-",
                    status: item.status,
                    source: "indents_" + clean,
                    index: idx,
                    isDateTime: false
                });
            }
        });

        // Gatepasses
        let gates = JSON.parse(localStorage.getItem("gatepass_" + clean)) || [];
        gates.forEach((item, idx) => {
            if (item.status === "Pending") {
                allPending.push({
                    type: "Gatepass",
                    block: block,
                    raisedDate: item.dateTime ? item.dateTime.split("T")[0] : "-",
                    completedDate: item.completedDate || "-",
                    item: item.purpose || "-",
                    person: item.personName || "-",
                    status: item.status,
                    source: "gatepass_" + clean,
                    index: idx,
                    isDateTime: true
                });
            }
        });
    });

    renderTable();
}

function renderTable() {
    const tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML = "";

    if (allPending.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="padding:30px; color:#d32f2f;">పెండింగ్ వర్క్స్ లేవు</td></tr>`;
        return;
    }

    allPending.forEach((item, i) => {
        tbody.innerHTML += `
        <tr>
            <td><strong>${item.type}</strong></td>
            <td>${item.block}</td>
            <td>${item.raisedDate}</td>
            <td class="completed">${item.completedDate || '-'}</td>
            <td style="text-align:left;">${item.item}</td>
            <td>${item.person}</td>
            <td><strong>${item.status}</strong></td>
            <td>
                <button class="action-btn" style="background:#2196F3; color:white;" 
                        onclick="editItem(${i})">✏️ Edit (Date & Status)</button>
                <button class="action-btn" style="background:#f44336; color:white;" 
                        onclick="deleteItem(${i})">🗑 Delete</button>
            </td>
        </tr>`;
    });
}

// ================= EDIT RAISED DATE + COMPLETED DATE + STATUS =================
function editItem(i) {
    const p = allPending[i];

    let newRaised = prompt(`Raised Date (ప్రస్తుతం: ${p.raisedDate})\nకొత్త Raised Date (YYYY-MM-DD):`, p.raisedDate);
    if (newRaised === null) return;

    let newCompleted = prompt(`Completed Date (ఎప్పుడు పూర్తి అయింది?)\nYYYY-MM-DD ఎంటర్ చేయండి (లేదా ఖాళీగా వదలండి):`, p.completedDate || "");

    let newStatus = prompt(`స్టేటస్ (ప్రస్తుతం: ${p.status})\nకొత్త స్టేటస్:`, p.status);

    if (!newStatus) return;
    newStatus = newStatus.trim();

    const validStatuses = ["Pending", "In Progress", "Completed", "Approved", "Issued", "Returned"];
    if (!validStatuses.includes(newStatus)) {
        alert("Invalid Status! సరైన స్టేటస్ ఎంటర్ చేయండి.");
        return;
    }

    // Update in localStorage
    let dataArray = JSON.parse(localStorage.getItem(p.source)) || [];
    if (dataArray[p.index]) {
        const record = dataArray[p.index];

        // Raised Date Update
        if (p.isDateTime) {
            let dt = record.dateTime || "";
            if (dt && newRaised) {
                const timePart = dt.includes("T") ? dt.split("T")[1] : "00:00";
                record.dateTime = newRaised + "T" + timePart;
            }
        } else {
            if (newRaised) record.date = newRaised;
        }

        // Completed Date
        record.completedDate = newCompleted || "";

        // Status
        record.status = newStatus;

        localStorage.setItem(p.source, JSON.stringify(dataArray));
    }

    alert("✅ Raised Date, Completed Date & Status అప్‌డేట్ చేయబడ్డాయి!");
    loadAllPending();
}

function deleteItem(i) {
    if (confirm("ఈ రికార్డ్ తీసేయాలా?")) {
        const p = allPending[i];
        let data = JSON.parse(localStorage.getItem(p.source)) || [];
        data.splice(p.index, 1);
        localStorage.setItem(p.source, JSON.stringify(data));
        loadAllPending();
    }
}

function deleteAllPending() {
    if (confirm("అన్ని పెండింగ్ వర్క్స్ తీసేయాలా?")) {
        const blocks = ["NGH","NSSH","NNC","OPD BLOCK","NMC","NDC","NPC","CAMP OFFICE","SITE OFFICE","BOYS HOSTEL","GIRLS HOSTEL","OTHER"];

        let works = JSON.parse(localStorage.getItem("works")) || [];
        works = works.filter(x => x.status !== "Pending");
        localStorage.setItem("works", JSON.stringify(works));

        blocks.forEach(b => {
            const c = b.replace(/\s+/g, "_");
            ["works_", "indents_", "gatepass_"].forEach(prefix => {
                let arr = JSON.parse(localStorage.getItem(prefix + c)) || [];
                arr = arr.filter(x => x.status !== "Pending");
                localStorage.setItem(prefix + c, JSON.stringify(arr));
            });
        });

        alert("✅ అన్ని పెండింగ్ రికార్డులు తీసేయబడ్డాయి!");
        loadAllPending();
    }
}

function exportExcel() {
    if (allPending.length === 0) return alert("డేటా లేదు!");
    let csv = "టైపు,బ్లాక్,Raised Date,Completed Date,ఐటెం,వ్యక్తి,స్టేటస్\n";
    allPending.forEach(item => {
        csv += `"${item.type}","${item.block}","${item.raisedDate}","${item.completedDate || ''}","${item.item.replace(/"/g,'""')}","${item.person}","${item.status}"\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Pending_Works_With_Dates.csv";
    link.click();
}

function printPage() { window.print(); }
function goBack() { window.location.href = "dashboard.html"; }

// Initialize
window.onload = loadAllPending;
</script>

</body>
</html>
