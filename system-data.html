<!DOCTYPE html>
<html>
<head>
    <title>System Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
    body {
        font-family: Arial;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        padding: 20px;
    }
    h2 {
        text-align: center;
        margin-bottom: 40px;
        font-size: 32px;
    }
    .blocks-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
        max-width: 1400px;
        margin: 0 auto;
    }
    .block-card {
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 35px 20px;
        text-align: center;
        transition: all 0.4s ease;
        border: 2px solid rgba(255,255,255,0.2);
    }
    .block-card:hover {
        transform: translateY(-15px) scale(1.08);
        background: rgba(255,255,255,0.25);
        border-color: #ffff00;
        box-shadow: 0 0 30px rgba(255, 255, 0, 0.5);
    }
    .block-card i {
        font-size: 65px;
        margin-bottom: 20px;
        color: #ffff00;
    }
    .block-name {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 25px;
    }
    .btn {
        padding: 14px 22px;
        margin: 8px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        width: 48%;
    }
    .enter-btn { background: linear-gradient(135deg, #4CAF50, #66bb6a); color: white; }
    .view-btn { background: linear-gradient(135deg, #2196F3, #42a5f5); color: white; }
    .top-buttons { text-align: center; margin-bottom: 40px; }
    </style>
</head>
<body>

<h2>🖥️ System Data Management</h2>

<div class="top-buttons">
    <button onclick="goBack()" 
            style="background:#333; color:white; padding:12px 28px; border:none; border-radius:10px; font-size:17px;">
        ⬅ Back to Dashboard
    </button>
</div>

<div class="blocks-container" id="blocksContainer"></div>

<script>
const blocks = [
    "NGH", "NSSH", "NNC", "OPD BLOCK", "NMC", "NDC", "NPC", 
    "CAMP OFFICE", "SITE OFFICE", "BOYS HOSTEL", "GIRLS HOSTEL", "OTHER"
];

function renderBlocks() {
    const container = document.getElementById("blocksContainer");
    container.innerHTML = "";

    blocks.forEach(block => {
        const card = document.createElement("div");
        card.className = "block-card";
        card.innerHTML = `
            <i class="fas fa-desktop"></i>
            <div class="block-name">${block}</div>
            
            <button class="btn enter-btn" onclick="enterSystemData('${block}')">
                📝 Enter System Data
            </button>
            <button class="btn view-btn" onclick="viewSystemData('${block}')">
                👁 View System Data
            </button>
        `;
        container.appendChild(card);
    });
}

function enterSystemData(blockName) {
    window.location.href = `system-form.html?block=${encodeURIComponent(blockName)}`;
}

function viewSystemData(blockName) {
    localStorage.setItem("currentBlock", blockName);
    window.location.href = "system-view.html";
}

function goBack() {
    window.location.href = "dashboard.html";
}

renderBlocks();
</script>

</body>
</html>
