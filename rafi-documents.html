<!DOCTYPE html>
<html>
<head>
    <title>Mr. Rafi Documents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    body { margin:0; font-family:Arial; background: linear-gradient(135deg, #6a11cb, #2575fc); color:white; }
    header { text-align:center; padding:20px; font-size:26px; background:rgba(0,0,0,0.4); }
    .back-btn, .logout { position:fixed; top:20px; padding:10px 18px; border:none; border-radius:8px; cursor:pointer; }
    .back-btn { left:20px; background:#00bfff; color:white; }
    .logout { right:20px; background:#e74c3c; color:white; }
    .container { padding:80px 20px 30px; display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:20px; }
    .doc-card { background:rgba(255,255,255,0.15); padding:25px; border-radius:15px; text-align:center; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
    <button class="logout" onclick="logout()">Logout</button>

    <header>📁 Mr. Rafi Documents - Super Block</header>

    <div class="container" id="docsContainer"></div>

    <script>
    function loadDocuments() {
        const container = document.getElementById('docsContainer');
        // Example documents - you can store in localStorage later
        const docs = [
            {name: "Monthly Report.pdf", date: "01-05-2026"},
            {name: "Inventory List.xlsx", date: "30-04-2026"},
            {name: "Project Notes.docx", date: "28-04-2026"}
        ];

        let html = '';
        docs.forEach(doc => {
            html += `
                <div class="doc-card">
                    <i class="fas fa-file-alt" style="font-size:50px; margin-bottom:10px;"></i>
                    <h4>${doc.name}</h4>
                    <p>Date: ${doc.date}</p>
                    <button onclick="alert('Opening ${doc.name}...')" style="margin-top:10px; padding:8px 15px;">Open</button>
                </div>`;
        });
        container.innerHTML = html;
    }

    function goBack() { window.location.href = "dashboard.html"; }
    function logout() {
        if(confirm("లాగ్ అవుట్ చేయాలా?")) window.location.href = "index.html";
    }

    window.onload = loadDocuments;
    </script>
</body>
</html>
