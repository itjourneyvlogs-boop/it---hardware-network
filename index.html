<!DOCTYPE html>
<html>
<head>
    <title>Secure Login - IT Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        overflow: hidden;
        position: relative;
    }

    /* Background Image - నీ ఫైల్ నుండి వస్తుంది */
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: url('bg.jpg') no-repeat center center/cover;
        opacity: 0.85;
        z-index: -1;
    }

    .login-box {
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(12px);
        padding: 45px 40px;
        border-radius: 20px;
        width: 380px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255,255,255,0.15);
        z-index: 10;
    }

    h2 {
        color: #00e5ff;
        margin-bottom: 10px;
        font-size: 28px;
    }

    p {
        color: #a0c4ff;
        margin-bottom: 25px;
    }

    .input-group {
        position: relative;
        margin: 15px 0;
    }

    .input-group i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #00e5ff;
        font-size: 18px;
    }

    input {
        width: 100%;
        padding: 14px 45px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
        color: white;
        font-size: 16px;
    }

    input:focus {
        outline: none;
        border-color: #00e5ff;
        box-shadow: 0 0 0 3px rgba(0,229,255,0.25);
    }

    .captcha-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 0;
    }

    #captchaText {
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 6px;
        background: rgba(255,255,255,0.95);
        color: #1e3c72;
        padding: 10px 20px;
        border-radius: 8px;
        user-select: none;
        flex: 1;
    }

    button {
        width: 100%;
        padding: 14px;
        margin: 12px 0;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn {
        background: linear-gradient(135deg, #00bcd4, #00e5ff);
        color: white;
    }

    .login-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0, 188, 212, 0.5);
    }

    .change-btn {
        background: #ff9800;
        color: white;
    }

    #msg {
        margin-top: 15px;
        font-weight: bold;
        min-height: 25px;
    }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🔐 Secure Login</h2>
    <p>IT Work Management System</p>

    <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" value="admin">
    </div>

    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password">
    </div>

    <div class="captcha-container">
        <span id="captchaText"></span>
        <button onclick="generateCaptcha()" style="padding:10px 14px; width:auto; background:rgba(255,255,255,0.2); color:white; border:none; border-radius:8px;">
            <i class="fas fa-redo"></i>
        </button>
    </div>
    <input type="text" id="captchaInput" placeholder="Enter CAPTCHA" maxlength="6" style="margin-bottom:20px;">

    <button class="login-btn" onclick="login()">LOGIN</button>
    <button class="change-btn" onclick="changePassword()">Change Password</button>

    <p id="msg"></p>
</div>

<script>
// Password Hashing
async function hashPassword(password) {
    const msgBuffer = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function initializeDefault() {
    if (!localStorage.getItem("username")) {
        localStorage.setItem("username", "admin");
        const hashed = await hashPassword("admin123");
        localStorage.setItem("password", hashed);
    }
}

let currentCaptcha = "";

function generateCaptcha() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    currentCaptcha = "";
    for (let i = 0; i < 6; i++) {
        currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById("captchaText").innerText = currentCaptcha;
}

async function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const captchaInput = document.getElementById("captchaInput").value.trim().toUpperCase();
    const msg = document.getElementById("msg");

    if (!user || !pass) {
        msg.style.color = "#ff6666";
        msg.innerHTML = "⚠️ Username & Password required!";
        return;
    }
    if (captchaInput !== currentCaptcha) {
        msg.style.color = "#ff6666";
        msg.innerHTML = "❌ Invalid CAPTCHA!";
        generateCaptcha();
        document.getElementById("captchaInput").value = "";
        return;
    }

    const savedUser = localStorage.getItem("username");
    const savedHash = localStorage.getItem("password");
    const inputHash = await hashPassword(pass);

    if (user === savedUser && inputHash === savedHash) {
        localStorage.setItem("loggedIn", "true");
        msg.style.color = "#4CAF50";
        msg.innerHTML = "✅ Login Successful! Redirecting...";
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1000);
    } else {
        msg.style.color = "#ff6666";
        msg.innerHTML = "❌ Invalid Username or Password!";
        generateCaptcha();
        document.getElementById("captchaInput").value = "";
    }
}

async function changePassword() {
    const oldPass = prompt("Enter Current Password:");
    if (!oldPass) return;

    const savedHash = localStorage.getItem("password");
    const oldHash = await hashPassword(oldPass);

    if (oldHash === savedHash) {
        const newPass = prompt("Enter New Password (minimum 6 characters):");
        if (newPass && newPass.length >= 6) {
            const newHash = await hashPassword(newPass);
            localStorage.setItem("password", newHash);
            alert("✅ Password Changed Successfully!");
        } else {
            alert("❌ Password must be at least 6 characters!");
        }
    } else {
        alert("❌ Wrong Current Password!");
    }
}

// Initialize
window.onload = () => {
    initializeDefault();
    generateCaptcha();
};

document.addEventListener("keypress", (e) => {
    if (e.key === "Enter") login();
});
</script>

</body>
</html>
