<!DOCTYPE html>
<html>
<head>
    <title>My Work Entry</title>

    <style>
    body {
        font-family: Arial;
        background: #f4f6f9;
        padding: 20px;
    }
    h2 { text-align: center; color: #1e3c72; }

    .form-box {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    label {
        display: block;
        margin: 12px 0 6px 0;
        font-weight: bold;
        color: #333;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-size: 16px;
    }

    button {
        background: #00bcd4;
        color: white;
        border: none;
        padding: 14px;
        width: 100%;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        margin-top: 10px;
    }

    .back-btn {
        background: #333;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-bottom: 20px;
    }

    select {
        background: white;
    }
    </style>
</head>

<body>

<h2>📋 Daily Work Entry</h2>

<div style="text-align: center; margin-bottom: 20px;">
    <button onclick="goBackToMenu()" class="back-btn">
        ⬅ Back to Dashboard
    </button>
</div>

<div class="form-box">

<form id="workForm">

    <label>S.No</label>
    <input type="number" id="sno" required>

    <label>Date</label>
    <input type="date" id="date" required>

    <label>Time</label>
    <input type="time" id="time" required>

    <!-- BLOCK NAME AS DROPDOWN -->
    <label>Block Name <span style="color:red;">*</span></label>
    <select id="block" required>
        <option value="">-- Select Block --</option>
        <option value="NGH">NGH</option>
        <option value="NSSH">NSSH</option>
        <option value="NNC">NNC</option>
        <option value="OPD BLOCK">OPD BLOCK</option>
        <option value="NMC">NMC</option>
        <option value="NDC">NDC</option>
        <option value="NPC">NPC</option>
        <option value="CAMP OFFICE">CAMP OFFICE</option>
        <option value="SITE OFFICE">SITE OFFICE</option>
        <option value="BOYS HOSTEL">BOYS HOSTEL</option>
        <option value="GIRLS HOSTEL">GIRLS HOSTEL</option>
        <option value="OTHER">OTHER</option>
    </select>

    <label>Department Name</label>
    <input type="text" id="dept">

    <label>Floor</label>
    <input type="text" id="floor">

    <label>Problem</label>
    <textarea id="problem" rows="3" placeholder="Describe the problem..."></textarea>

    <label>Refer Ticket Number</label>
    <input type="text" id="ticket">

    <label>Status</label>
    <select id="status">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
    </select>

    <!-- Pending Reason -->
    <label id="pendingReasonLabel" style="color: #d32f2f; display: none;">Pending Reason (ఎందుకు Pending ఉంది?)</label>
    <textarea id="pendingReason" rows="3" style="display: none;" 
              placeholder="Enter reason why the work is pending..."></textarea>

    <button type="submit">Save Entry</button>

</form>

</div>

<script>

// All Blocks List (same as other files)
const blocks = [
    "NGH", "NSSH", "NNC", "OPD BLOCK", "NMC", "NDC", "NPC", 
    "CAMP OFFICE", "SITE OFFICE", "BOYS HOSTEL", "GIRLS HOSTEL", "OTHER"
];

// Status change handler for Pending Reason
document.getElementById("status").addEventListener("change", function() {
    const reasonLabel = document.getElementById("pendingReasonLabel");
    const reasonField = document.getElementById("pendingReason");

    if (this.value === "Pending") {
        reasonLabel.style.display = "block";
        reasonField.style.display = "block";
    } else {
        reasonLabel.style.display = "none";
        reasonField.style.display = "none";
        reasonField.value = "";
    }
});

// Save Form
document.getElementById("workForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = {
        sno: document.getElementById("sno").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        block: document.getElementById("block").value,
        dept: document.getElementById("dept").value,
        floor: document.getElementById("floor").value,
        problem: document.getElementById("problem").value,
        ticket: document.getElementById("ticket").value,
        status: document.getElementById("status").value,
        pendingReason: document.getElementById("pendingReason").value.trim()
    };

    if (!formData.block) {
        alert("Please select a Block Name!");
        return;
    }

    const blockKey = "works_" + formData.block.replace(/\s+/g, "_");
    
    let oldData = JSON.parse(localStorage.getItem(blockKey)) || [];
    oldData.push(formData);

    localStorage.setItem(blockKey, JSON.stringify(oldData));

    alert("✅ Work Entry Saved Successfully!");

    // Reset form
    this.reset();
    
    // Reset block to "Select Block" 
    document.getElementById("block").value = "";
});

function goBackToMenu() {
    window.location.href = "dashboard.html";
}

</script>

</body>
</html>
