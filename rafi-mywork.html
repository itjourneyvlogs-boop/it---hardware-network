<!DOCTYPE html>
<html>
<head>
    <title>Mr. Rafi - My Work</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    body { margin:0; font-family:Arial; background: linear-gradient(135deg, #6a11cb, #2575fc); color:white; }
    header { text-align:center; padding:20px; font-size:26px; background:rgba(0,0,0,0.4); }
    .back-btn {
        position: fixed; top: 20px; left: 20px;
        padding: 10px 18px; background: #00bfff; color: white;
        border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .logout { position: fixed; top: 20px; right: 20px; padding: 10px 18px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .container { padding: 80px 20px 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: rgba(255,255,255,0.15); padding: 20px; border-radius: 15px; }
    .edit-btn { background:#ffd700; color:black; padding:5px 12px; border:none; border-radius:5px; cursor:pointer; margin-top:10px; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
    <button class="logout" onclick="logout()">Logout</button>

    <header>👤 Mr. Rafi My Work - Super Block</header>

    <div class="container" id="workContainer"></div>

    <script>
    function loadSuperBlockData() {
        const container = document.getElementById('workContainer');
        let data = JSON.parse(localStorage.getItem('works_SUPER_BLOCK') || '[]');

        if(data.length === 0) {
            container.innerHTML = `<div class="card"><h3>No Data Available for Super Block</h3></div>`;
            return;
        }

        let html = '';
        data.forEach((item, index) => {
            html += `
                <div class="card">
                    <h3>${item.title || 'Untitled Work'}</h3>
                    <p><strong>Date:</strong> ${item.date || 'N/A'}</p>
                    <p><strong>Details:</strong> ${item.details || 'No details'}</p>
                    <p><strong>Status:</strong> ${item.status || 'Pending'}</p>
                    <button class="edit-btn" onclick="editItem(${index})">✏️ Edit</button>
                </div>`;
        });
        container.innerHTML = html;
    }

    function editItem(index) {
        let data = JSON.parse(localStorage.getItem('works_SUPER_BLOCK') || '[]');
        const newTitle = prompt("Update Title:", data[index].title);
        if(newTitle !== null) {
            data[index].title = newTitle;
            localStorage.setItem('works_SUPER_BLOCK', JSON.stringify(data));
            loadSuperBlockData();
        }
    }

    function goBack() {
        window.location.href = "dashboard.html";
    }

    function logout() {
        if(confirm("లాగ్ అవుట్ చేయాలా?")) {
            localStorage.removeItem("loggedIn");
            window.location.href = "index.html";
        }
    }

    window.onload = loadSuperBlockData;
    </script>
</body>
</html>
