<!DOCTYPE html>
<html>
<head>
    <title>పెండింగ్ వర్క్స్</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
    body {
        font-family: Arial;
        background: #f4f6f9;
        padding: 20px;
        margin: 0;
    }
    .top {
        margin-bottom: 15px;
        text-align: center;
    }
    button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        color: white;
        font-weight: bold;
    }
    .back { background: #333; }
    .excel { background: green; }
    .print { background: blue; }
    .delete { background: red; }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 10px;
    }
    th, td {
        border: 1px solid #666;
        padding: 10px;
        text-align: center;
    }
    th {
        background: #00bcd4;
        color: white;
    }
    </style>
</head>

<body>

<div class="top">
    <button class="back" onclick="goBack()">⬅ డాష్‌బోర్డ్‌కి వెళ్లు</button>
    <button class="excel" onclick="exportExcel()">📄 Excel డౌన్‌లోడ్</button>
    <button class="print" onclick="printPage()">🖨 ప్రింట్</button>
    <button class="delete" onclick="deleteAllPending()">🗑 అన్ని పెండింగ్ తీసేయి</button>
</div>

<h2>⏳ అన్ని పెండింగ్ వర్క్స్ (ఆటో అప్‌డేట్)</h2>

<table id="dataTable">
<thead>
<tr>
    <th>టైపు</th>
    <th>బ్లాక్</th>
    <th>తేదీ</th>
    <th>సమస్య / మెటీరియల్</th>
    <th>వ్యక్తి / డిపార్ట్‌మెంట్</th>
    <th>స్టేటస్</th>
    <th>యాక్షన్</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let allPending = [];

function loadAllPending() {
    allPending = [];
    const blocks = ["NGH","NSSH","NNC","OPD BLOCK","NMC","NDC","NPC","CAMP OFFICE","SITE OFFICE","BOYS HOSTEL","GIRLS HOSTEL","OTHER"];

    // 1. General Works
    let general = JSON.parse(localStorage.getItem("works")) || [];
    general.forEach((item, idx) => {
        if (item.status === "Pending") {
            allPending.push({type: "Work", block: item.block || "-", date: item.date, item: item.problem || "-", person: item.dept || "-", status: "Pending", source: "works", index: idx});
        }
    });

    // 2. Block Works, Indents & Gatepasses
    blocks.forEach(block => {
        const clean = block.replace(/\s+/g, "_");

        // Block Works
        let bworks = JSON.parse(localStorage.getItem("works_" + clean)) || [];
        bworks.forEach((item, idx) => {
            if (item.status === "Pending") {
                allPending.push({type: "Block", block: block, date: item.date, item: item.problem || "-", person: item.dept || "-", status: "Pending", source: "works_" + clean, index: idx});
            }
        });

        // Indents
        let indents = JSON.parse(localStorage.getItem("indents_" + clean)) || [];
        indents.forEach((item, idx) => {
            if (item.status === "Pending") {
                allPending.push({type: "Indent", block: block, date: item.date, item: item.material || "-", person: item.personName || "-", status: "Pending", source: "indents_" + clean, index: idx});
            }
        });

        // Gatepasses
        let gates = JSON.parse(localStorage.getItem("gatepass_" + clean)) || [];
        gates.forEach((item, idx) => {
            if (item.status === "Pending") {
                allPending.push({type: "Gatepass", block: block, date: item.dateTime ? item.dateTime.split("T")[0] : "-", item: item.purpose || "-", person: item.personName || "-", status: "Pending", source: "gatepass_" + clean, index: idx});
            }
        });
    });

    renderTable();
}

function renderTable() {
    const tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML = "";

    if (allPending.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="padding:30px; color:#d32f2f;">పెండింగ్ వర్క్స్ లేవు</td></tr>`;
        return;
    }

    allPending.forEach((item, i) => {
        tbody.innerHTML += `
        <tr>
            <td><strong>${item.type}</strong></td>
            <td>${item.block}</td>
            <td>${item.date || '-'}</td>
            <td style="text-align:left;">${item.item}</td>
            <td>${item.person}</td>
            <td><strong>${item.status}</strong></td>
            <td>
                <button style="background:#2196F3; color:white; padding:6px 12px; border:none; border-radius:4px; margin-right:5px;" 
                        onclick="editStatus(${i})">✏️ స్టేటస్ మార్చు</button>
                <button style="background:#f44336; color:white; padding:6px 12px; border:none; border-radius:4px;" 
                        onclick="deleteItem(${i})">🗑 తీసేయి</button>
            </td>
        </tr>`;
    });
}

// ================= STATUS EDIT + AUTO REMOVE =================
function editStatus(i) {
    const p = allPending[i];
    let newStatus = prompt(`ప్రస్తుత స్టేటస్: ${p.status}\n\nకొత్త స్టేటస్ ఎంటర్ చేయండి:\n\nPending\nIn Progress\nCompleted\nApproved\nIssued\nReturned`, p.status);

    if (!newStatus) return;
    newStatus = newStatus.trim();

    const validStatuses = ["Pending", "In Progress", "Completed", "Approved", "Issued", "Returned"];
    if (!validStatuses.includes(newStatus)) {
        alert("Invalid Status! సరైన స్టేటస్ ఎంటర్ చేయండి.");
        return;
    }

    // Original dataలో స్టేటస్ అప్‌డేట్ చేయి
    let dataArray = JSON.parse(localStorage.getItem(p.source)) || [];
    if (dataArray[p.index]) {
        dataArray[p.index].status = newStatus;
        localStorage.setItem(p.source, JSON.stringify(dataArray));
    }

    alert(`✅ స్టేటస్ "${newStatus}"కి మార్చబడింది!`);

    // Completed అయితే Pending లిస్ట్ నుండి ఆటోమాటిక్‌గా తీసేయి
    if (newStatus !== "Pending") {
        loadAllPending();   // Refresh చేస్తే Pending లిస్ట్ నుండి తీసేయబడుతుంది
    } else {
        renderTable();      // Pendingగా ఉంటే మాత్రమే టేబుల్ రీఫ్రెష్
    }
}

function deleteItem(i) {
    if (confirm("ఈ రికార్డ్ తీసేయాలా?")) {
        const p = allPending[i];
        let data = JSON.parse(localStorage.getItem(p.source)) || [];
        data.splice(p.index, 1);
        localStorage.setItem(p.source, JSON.stringify(data));
        loadAllPending();
    }
}

function deleteAllPending() {
    if (confirm("అన్ని పెండింగ్ వర్క్స్ తీసేయాలా? ఈ చర్య వెనక్కి తీసుకోలేము!")) {
        const blocks = ["NGH","NSSH","NNC","OPD BLOCK","NMC","NDC","NPC","CAMP OFFICE","SITE OFFICE","BOYS HOSTEL","GIRLS HOSTEL","OTHER"];

        // General Works
        let works = JSON.parse(localStorage.getItem("works")) || [];
        works = works.filter(x => x.status !== "Pending");
        localStorage.setItem("works", JSON.stringify(works));

        // Block wise
        blocks.forEach(b => {
            const c = b.replace(/\s+/g, "_");
            ["works_", "indents_", "gatepass_"].forEach(prefix => {
                let arr = JSON.parse(localStorage.getItem(prefix + c)) || [];
                arr = arr.filter(x => x.status !== "Pending");
                localStorage.setItem(prefix + c, JSON.stringify(arr));
            });
        });

        alert("✅ అన్ని పెండింగ్ రికార్డులు తీసేయబడ్డాయి!");
        loadAllPending();
    }
}

function exportExcel() {
    if (allPending.length === 0) return alert("డేటా లేదు!");
    let csv = "టైపు,బ్లాక్,తేదీ,ఐటెం,వ్యక్తి,స్టేటస్\n";
    allPending.forEach(item => {
        csv += `"${item.type}","${item.block}","${item.date || ''}","${item.item.replace(/"/g,'""')}","${item.person}","${item.status}"\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Pending_Works.csv";
    link.click();
}

function printPage() { window.print(); }
function goBack() { window.location.href = "dashboard.html"; }

// Initialize
window.onload = loadAllPending;
</script>

</body>
</html>
