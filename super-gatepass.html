<!DOCTYPE html>
<html>
<head>
    <title>Super Block Gate Pass</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    body { margin:0; font-family:Arial; background: linear-gradient(135deg, #6a11cb, #2575fc); color:white; }
    header { text-align:center; padding:20px; font-size:26px; background:rgba(0,0,0,0.4); }
    .back-btn, .logout { position:fixed; top:20px; padding:10px 18px; border:none; border-radius:8px; cursor:pointer; }
    .back-btn { left:20px; background:#00bfff; color:white; }
    .logout { right:20px; background:#e74c3c; color:white; }
    .container { padding:80px 20px 30px; }
    table { width:100%; border-collapse:collapse; background:rgba(255,255,255,0.1); }
    th, td { padding:12px; border:1px solid rgba(255,255,255,0.3); }
    th { background:rgba(0,0,0,0.4); }
    .edit-btn { background:#ffd700; color:black; padding:6px 12px; border:none; border-radius:5px; cursor:pointer; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
    <button class="logout" onclick="logout()">Logout</button>

    <header>🏷️ Super Block Gate Pass - Mr. Rafi</header>

    <div class="container">
        <table id="gateTable"></table>
    </div>

    <script>
    function loadGatePass() {
        const tbody = document.getElementById('gateTable');
        let data = JSON.parse(localStorage.getItem('gatepass_SUPER_BLOCK') || '[]');
        let html = `<tr><th>Date</th><th>Person</th><th>Item</th><th>Purpose</th><th>Status</th><th>Action</th></tr>`;

        if(data.length === 0) {
            html += `<tr><td colspan="6" style="text-align:center;">No Gate Pass Records</td></tr>`;
        } else {
            data.forEach((item, i) => {
                html += `
                    <tr>
                        <td>${item.date || 'N/A'}</td>
                        <td>${item.person || 'Rafi'}</td>
                        <td>${item.item || 'N/A'}</td>
                        <td>${item.purpose || 'N/A'}</td>
                        <td>${item.status || 'Approved'}</td>
                        <td><button class="edit-btn" onclick="editGate(${i})">✏️ Edit</button></td>
                    </tr>`;
            });
        }
        tbody.innerHTML = html;
    }

    function editGate(index) {
        let data = JSON.parse(localStorage.getItem('gatepass_SUPER_BLOCK') || '[]');
        const status = prompt("Update Status:", data[index].status);
        if(status) {
            data[index].status = status;
            localStorage.setItem('gatepass_SUPER_BLOCK', JSON.stringify(data));
            loadGatePass();
        }
    }

    function goBack() { window.location.href = "dashboard.html"; }
    function logout() {
        if(confirm("లాగ్ అవుట్ చేయాలా?")) window.location.href = "index.html";
    }

    window.onload = loadGatePass;
    </script>
</body>
</html>
