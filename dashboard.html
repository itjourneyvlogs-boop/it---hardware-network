<!DOCTYPE html>
<html>
<head>
    <title>IT Work Management Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        min-height: 100vh;
    }
    header {
        text-align: center;
        padding: 25px;
        font-size: 28px;
        font-weight: bold;
        background: rgba(0,0,0,0.3);
    }
    .tabs {
        display: flex;
        justify-content: center;
        background: rgba(0,0,0,0.4);
        padding: 12px 0;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .tab-button {
        padding: 14px 35px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        background: rgba(255,255,255,0.1);
        color: white;
        margin: 5px 10px;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .tab-button.active {
        background: #00e5ff;
        color: #1e3c72;
        box-shadow: 0 5px 20px rgba(0,229,255,0.5);
    }
    .tab-content { display: none; padding: 10px 20px; }
    .tab-content.active { display: block; }

    .search-container { text-align: center; margin: 20px auto; max-width: 700px; }
    #searchInput {
        width: 90%; max-width: 650px; padding: 16px 20px; font-size: 17px;
        border: none; border-radius: 50px; background: rgba(255,255,255,0.95);
        color: #333;
    }
    .chart-box {
        width: 380px; margin: 25px auto; background: rgba(255,255,255,0.12);
        padding: 25px; border-radius: 20px; backdrop-filter: blur(12px);
    }
    .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 25px;
        padding: 20px 30px;
    }
    .card {
        background: rgba(255,255,255,0.15);
        border-radius: 18px;
        padding: 25px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s;
    }
    .card:hover { transform: translateY(-10px) scale(1.05); background: rgba(255,255,255,0.25); }
    .system-card {
        background: linear-gradient(135deg, #ff0066, #ff3399);
        box-shadow: 0 0 35px rgba(255,51,153,0.9);
        animation: glow 2s infinite alternate;
    }
    @keyframes glow { from {box-shadow: 0 0 20px rgba(255,51,153,0.7);} to {box-shadow: 0 0 45px rgba(255,51,153,1);} }

    .coming-soon {
        text-align: center;
        padding: 100px 20px;
        font-size: 32px;
        font-weight: bold;
        color: #ffd700;
    }

    .logout {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #e74c3c;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        z-index: 1000;
    }
    </style>
</head>
<body>

<header>🚀 IT Work Management Dashboard</header>

<!-- Logout Button -->
<button class="logout" onclick="logout()">🚪 Logout</button>

<!-- Tabs -->
<div class="tabs">
    <button class="tab-button active" onclick="switchTab(0)">📊 All Blocks</button>
    <button class="tab-button" onclick="switchTab(1)">📁 Data</button>
</div>

<!-- ==================== TAB 1: ALL BLOCKS ==================== -->
<div id="tab0" class="tab-content active">
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Search Equipment, Problem, Material, Person, IP, Serial No..." onkeyup="globalSearch()">
    </div>

    <div class="chart-box">
        <canvas id="myChart"></canvas>
    </div>

    <div style="text-align:center; margin:20px;">
        <div class="card system-card" style="display:inline-block; width:300px;" onclick="openPage('System Data')">
            <i class="fas fa-server" style="color: #ffff00; font-size: 55px;"></i>
            <h3>System Data</h3>
        </div>
    </div>

    <div class="container">
        <div class="card" onclick="openPage('My Work')"><i class="fas fa-briefcase" style="color:#00e5ff"></i><h3>My Work</h3></div>
        <div class="card" onclick="openPage('Blocks')"><i class="fas fa-building" style="color:#ffcc00"></i><h3>Blocks</h3></div>
        <div class="card" onclick="openPage('Indents')"><i class="fas fa-file-invoice" style="color:#ff6f61"></i><h3>Indents</h3></div>
        <div class="card" onclick="openPage('Documents')"><i class="fas fa-folder-open" style="color:#66ff99"></i><h3>Documents</h3></div>
        <div class="card" onclick="openPage('Pending Works')"><i class="fas fa-hourglass-half" style="color:#ff66cc"></i><h3>Pending Works</h3></div>
        <div class="card" onclick="openPage('Gatepass')"><i class="fas fa-id-badge" style="color:#ffa500"></i><h3>Gatepass</h3></div>
    </div>
</div>

<!-- ==================== TAB 2: DATA (Coming Soon) ==================== -->
<div id="tab1" class="tab-content">
    <div class="coming-soon">
        <i class="fas fa-clock" style="font-size:80px; margin-bottom:20px;"></i><br>
        📁 Data Section<br>
        <span style="font-size:24px; color:#aaa;">Coming Soon...</span>
    </div>
</div>

<script>
// Login Check
if(localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "index.html";
}

let myChart;

function updateChart() {
    const blocks = ["NGH","NSSH","NNC","OPD BLOCK","NMC","NDC","NPC","CAMP OFFICE","SITE OFFICE","BOYS HOSTEL","GIRLS HOSTEL","OTHER"];
    let works=0, indents=0, gates=0, systems=0;

    works += (JSON.parse(localStorage.getItem("works")) || []).length;

    blocks.forEach(b => {
        const c = b.replace(/\s+/g, "_");
        works += (JSON.parse(localStorage.getItem("works_"+c)) || []).length;
        indents += (JSON.parse(localStorage.getItem("indents_"+c)) || []).length;
        gates += (JSON.parse(localStorage.getItem("gatepass_"+c)) || []).length;
        systems += (JSON.parse(localStorage.getItem("system_"+c)) || []).length;
    });

    const chartData = {
        labels: ['Works', 'Indents', 'Gatepass', 'Systems'],
        datasets: [{
            data: [works, indents, gates, systems],
            backgroundColor: ['#00e5ff','#ff6f61','#66ff99','#ffff00']
        }]
    };

    if(myChart) myChart.update();
    else {
        myChart = new Chart(document.getElementById('myChart'), {
            type: 'doughnut',
            data: chartData,
            options: {
                responsive: true,
                plugins: { legend: { position: 'bottom', labels: { color: 'white' } } }
            }
        });
    }
}

function switchTab(tabIndex) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    
    document.getElementById(`tab${tabIndex}`).classList.add('active');
    document.querySelectorAll('.tab-button')[tabIndex].classList.add('active');
}

function logout() {
    if(confirm("డాష్‌బోర్డ్ నుండి లాగ్ అవుట్ చేయాలా?")) {
        localStorage.removeItem("loggedIn");
        window.location.href = "index.html";
    }
}

function openPage(name) {
    const pages = {
        "My Work": "mywork.html",
        "Blocks": "blocks.html",
        "Indents": "indents.html",
        "Documents": "my-documents.html",
        "Pending Works": "view.html",
        "Gatepass": "gatepass.html",
        "System Data": "system-data.html"
    };
    if (pages[name]) window.location.href = pages[name];
}

function globalSearch() { /* Search Logic */ }

window.onload = () => {
    updateChart();
    setInterval(updateChart, 5000);
};
</script>
</body>
</html>
