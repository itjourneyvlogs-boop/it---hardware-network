<!DOCTYPE html>
<html>
<head>
    <title>Mr. Rafi Documents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    body { margin:0; font-family:Arial; background: linear-gradient(135deg, #6a11cb, #2575fc); color:white; }
    header { text-align:center; padding:25px; font-size:26px; }
    .container { padding:30px; display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:20px; }
    .doc-card { background:rgba(255,255,255,0.15); padding:20px; border-radius:12px; text-align:center; }
    .logout { position:fixed; top:20px; right:20px; padding:10px 18px; background:#e74c3c; border:none; color:white; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>
    <header>📁 Mr. Rafi Documents</header>
    <button class="logout" onclick="logout()">Logout</button>

    <div class="container">
        <div class="doc-card"><i class="fas fa-file-pdf" style="font-size:50px;"></i><h4>Monthly Report.pdf</h4></div>
        <div class="doc-card"><i class="fas fa-file-word" style="font-size:50px;"></i><h4>Project Plan.docx</h4></div>
        <div class="doc-card"><i class="fas fa-file-excel" style="font-size:50px;"></i><h4>Inventory.xlsx</h4></div>
    </div>

    <script>
    function logout(){ if(confirm("లాగ్ అవుట్ చేయాలా?")) window.location.href="index.html"; }
    </script>
</body>
</html>
