<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
    body {
        margin: 0;
        font-family: Arial;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
    }
    header { 
        text-align: center; 
        padding: 25px; 
        font-size: 28px; 
        font-weight: bold; 
    }

    .tabs {
        display: flex;
        justify-content: center;
        background: rgba(0,0,0,0.4);
        padding: 12px 0;
        margin-bottom: 10px;
    }
    .tab-button {
        padding: 14px 35px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        background: rgba(255,255,255,0.1);
        color: white;
        margin: 5px 10px;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .tab-button.active {
        background: #00e5ff;
        color: #1e3c72;
        box-shadow: 0 5px 20px rgba(0,229,255,0.5);
    }

    .tab-content { display: none; padding: 10px 20px; }
    .tab-content.active { display: block; }

    .search-container {
        text-align: center;
        margin: 15px auto 25px;
        max-width: 700px;
    }
    #searchInput {
        width: 90%; max-width: 650px; padding: 16px 20px; font-size: 17px;
        border: none; border-radius: 50px; background: rgba(255,255,255,0.95);
        color: #333; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    #searchInput:focus { outline: none; box-shadow: 0 8px 25px rgba(0,229,255,0.6); }

    .chart-box { width: 380px; margin: 25px auto; background: rgba(255,255,255,0.12); padding: 25px; border-radius: 20px; backdrop-filter: blur(12px); }
    .system-row { display: flex; justify-content: center; margin: 30px 0 20px 0; }
    .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; padding: 20px 30px; }
    .card {
        background: rgba(255,255,255,0.15);
        border-radius: 18px;
        padding: 30px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s;
    }
    .card:hover { transform: translateY(-12px) scale(1.08); background: rgba(255,255,255,0.25); }

    .system-card {
        background: linear-gradient(135deg, #ff0066, #ff3399);
        box-shadow: 0 0 35px rgba(255,51,153,0.9);
        animation: glow 2s infinite alternate;
        border: 3px solid #ffff00;
    }
    @keyframes glow { from {box-shadow: 0 0 20px rgba(255,51,153,0.7);} to {box-shadow: 0 0 45px rgba(255,51,153,1);} }

    .search-results {
        max-width: 1400px;
        margin: 30px auto;
        padding: 0 20px;
        display: none;
    }
    .search-results table {
        width: 100%;
        background: white;
        color: black;
        border-collapse: collapse;
    }
    .search-results th { background: #00bcd4; color: white; padding: 12px; }
    .search-results td { padding: 10px; border: 1px solid #ddd; }

    .coming-soon {
        text-align: center;
        padding: 120px 20px;
        font-size: 36px;
        font-weight: bold;
        color: #ffd700;
    }

    .logout {
        position: fixed; top: 20px; right: 20px;
        background: #e74c3c; color: white; border: none;
        padding: 12px 20px; border-radius: 8px; cursor: pointer;
        font-weight: bold; z-index: 1000;
    }
    </style>
</head>
<body>

<header>🚀 IT Work Management Dashboard</header>

<button class="logout" onclick="logout()">🚪 Logout</button>

<!-- Global Search -->
<div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Search Equipment, Problem, Material, Person, IP, Serial No..." 
           onkeyup="globalSearch()">
</div>

<!-- Tabs -->
<div class="tabs">
    <button class="tab-button active" onclick="switchTab(0)">📊 All Blocks</button>
    <button class="tab-button" onclick="switchTab(1)">📁 Data</button>
</div>

<!-- TAB 1: ALL BLOCKS -->
<div id="tab0" class="tab-content active">
    <div class="chart-box">
        <canvas id="myChart"></canvas>
    </div>

    <div class="system-row">
        <div class="card system-card" onclick="openPage('System Data')">
            <i class="fas fa-server" style="color: #ffff00; font-size: 58px;"></i>
            <h3>System Data</h3>
        </div>
    </div>

    <div class="container">
        <div class="card" onclick="openPage('My Work')"><i class="fas fa-briefcase" style="color:#00e5ff"></i><h3>My Work</h3></div>
        <div class="card" onclick="openPage('Blocks')"><i class="fas fa-building" style="color:#ffcc00"></i><h3>Blocks</h3></div>
        <div class="card" onclick="openPage('Indents')"><i class="fas fa-file-invoice" style="color:#ff6f61"></i><h3>Indents</h3></div>
        <div class="card" onclick="openPage('Documents')"><i class="fas fa-folder-open" style="color:#66ff99"></i><h3>My Documents</h3></div>
        <div class="card" onclick="openPage('Pending Works')"><i class="fas fa-hourglass-half" style="color:#ff66cc"></i><h3>Pending Works</h3></div>
        <div class="card" onclick="openPage('Gatepass')"><i class="fas fa-id-badge" style="color:#ffa500"></i><h3>Gatepass</h3></div>
    </div>
</div>

<!-- TAB 2: DATA -->
<div id="tab1" class="tab-content">
    <div class="coming-soon">
        <i class="fas fa-clock" style="font-size:90px;"></i><br><br>
        📁 DATA SECTION<br>
        <span style="font-size:24px;color:#ccc;">Coming Soon...</span>
    </div>
</div>

<!-- Search Results -->
<div class="search-results" id="searchResults">
    <h3 style="color:white; text-align:center;">🔍 Search Results</h3>
    <table id="searchTable">
        <thead>
            <tr>
                <th>Type</th>
                <th>Key</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
// Login Check
if(localStorage.getItem("loggedIn") !== "true") window.location.href = "index.html";

let myChart;

function updateChart() {
    // Chart code (same as before)
    const blocks = ["NGH","NSSH","NNC","OPD BLOCK","NMC","NDC","NPC","CAMP OFFICE","SITE OFFICE","BOYS HOSTEL","GIRLS HOSTEL","OTHER"];
    let works=0, indents=0, gates=0, systems=0;

    works += (JSON.parse(localStorage.getItem("works")) || []).length;
    blocks.forEach(b => {
        const c = b.replace(/\s+/g, "_");
        works += (JSON.parse(localStorage.getItem("works_"+c)) || []).length;
        indents += (JSON.parse(localStorage.getItem("indents_"+c)) || []).length;
        gates += (JSON.parse(localStorage.getItem("gatepass_"+c)) || []).length;
        systems += (JSON.parse(localStorage.getItem("system_"+c)) || []).length;
    });

    const chartData = {
        labels: ['Works', 'Indents', 'Gatepass', 'Systems'],
        datasets: [{ data: [works, indents, gates, systems], backgroundColor: ['#00e5ff','#ff6f61','#66ff99','#ffff00'] }]
    };

    if(myChart) myChart.update();
    else {
        myChart = new Chart(document.getElementById('myChart'), { type: 'doughnut', data: chartData, options: { responsive:true, plugins:{legend:{position:'bottom', labels:{color:'white'}}} } });
    }
}

function switchTab(tabIndex) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab'+tabIndex).classList.add('active');
    document.querySelectorAll('.tab-button')[tabIndex].classList.add('active');
}

// ==================== STRONG GLOBAL SEARCH ====================
function globalSearch() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    const resultsDiv = document.getElementById("searchResults");
    const tbody = document.querySelector("#searchTable tbody");

    if (query.length < 2) {
        resultsDiv.style.display = "none";
        return;
    }

    tbody.innerHTML = "";
    let found = false;

    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);

        if (value && (key.toLowerCase().includes(query) || value.toLowerCase().includes(query))) {
            found = true;
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>Stored Data</td>
                <td>${key}</td>
                <td style="max-width:600px; overflow-wrap:break-word;">${value.substring(0, 150)}...</td>
            `;
            tbody.appendChild(row);
        }
    }

    if (!found) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:30px; color:red;">No data found for "${query}"</td></tr>`;
    }

    resultsDiv.style.display = "block";
}

function logout() {
    if(confirm("డాష్‌బోర్డ్ నుండి లాగ్ అవుట్ చేయాలా?")) {
        localStorage.removeItem("loggedIn");
        window.location.href = "index.html";
    }
}

function openPage(name) {
    const pages = {
        "My Work": "mywork.html",
        "Blocks": "blocks.html",
        "Indents": "indents.html",
        "Documents": "my-documents.html",
        "Pending Works": "view.html",
        "Gatepass": "gatepass.html",
        "System Data": "system-data.html"
    };
    if (pages[name]) window.location.href = pages[name];
}

window.onload = () => {
    updateChart();
    setInterval(updateChart, 3000);
};
</script>
</body>
</html>
